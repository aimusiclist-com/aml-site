<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#101319">
<title>{{site_name}}</title>
<style>
  /* Midnight Chrome — a quiet, dark listening room. */
  :root {
    --aml-bg: #101319;
    --aml-panel: #1B2029;
    --aml-panel-2: #29303C;
    --aml-text: #F5F7FA;
    --aml-muted: #A7B4C5;
    --aml-line: rgb(245 247 250 / .10);
    --aml-glass: rgb(27 32 41 / .96);
    --aml-accent: #86BEEB;
    --aml-accent-fill: #86BEEB;
    --aml-accent-ink: #101319;
    --aml-font: -apple-system, BlinkMacSystemFont, "SF Pro Text",
      "Pretendard Variable", Pretendard, "Apple SD Gothic Neo",
      "Hiragino Sans", system-ui, "Segoe UI", Roboto,
      "Noto Sans Thai", "Leelawadee UI", "Noto Sans Devanagari",
      "Nirmala UI", sans-serif;
    --aml-hero-a: 10%;
    --aml-art-shadow: none;
    --aml-viz-color: #86BEEB;
    --aml-viz-opacity: .20;
    --aml-viz-gap: 3px;
    --aml-max: 1100px;
    --aml-player-left: 0;
    --aml-modal-bg: #1B2029;
    --aml-modal-text: #F5F7FA;
    --aml-card-bg: #1B2029;
    --aml-footer-color: #A7B4C5;
    --aml-social-color: #86BEEB;
    --aml-ext-color: #A7B4C5;
    --aml-error: #FF766D;
    color-scheme: dark;
  }

  .aml-kit { font-size: 15px; line-height: 1.55; letter-spacing: -.01em; }
  .mc-wrap { display: flex; flex-direction: column; min-height: 100vh; }
  .mc-side, .mc-main { display: contents; }

  /* Document order remains compact and useful on a phone. */
  .aml-banner { order: 1; }
  .mc-side .aml-hero { order: 2; }
  .mc-nav { order: 3; }
  .aml-ad-top { order: 4; }
  .aml-content { order: 5; width: 100%; }
  .aml-footer { order: 6; }
  .aml-ad-left { order: 7; }

  /* Opaque navigation uses no visual filters or continuous effects. */
  .mc-nav {
    position: sticky;
    top: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 16px;
    background: var(--aml-panel);
    border-bottom: 1px solid var(--aml-line);
  }
  .aml-kit .aml-menu-item { border-radius: 8px; }
  .aml-kit .aml-menu-item.is-active {
    background: var(--aml-panel-2);
    color: var(--aml-accent);
    font-weight: 600;
  }
  .aml-kit .aml-hero-name { font-size: 34px; font-weight: 700; }
  .aml-kit .aml-section-title { font-size: 20px; font-weight: 600; }
  .aml-kit .aml-list { gap: 6px; }
  .aml-kit .aml-track {
    height: 66px;
    border: 1px solid var(--aml-line);
    border-top-color: rgb(245 247 250 / .16);
    border-radius: 14px;
    box-shadow: none;
  }
  .aml-kit .aml-track-title {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -.01em;
  }
  .aml-kit .aml-track-artist { font-size: 13px; }
  .aml-kit .aml-albums {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 24px 18px;
  }
  .aml-kit .aml-album-cover {
    border-radius: 9px;
    box-shadow: none;
  }
  .aml-kit .aml-gb-form,
  .aml-kit .aml-gb-post,
  .aml-kit .aml-view-links .aml-social {
    border: 1px solid var(--aml-line);
    border-top-color: rgb(245 247 250 / .16);
    border-radius: 14px;
    box-shadow: none;
  }

  @media (min-width: 1068px) {
    body.aml-kit { --aml-player-left: 224px; }
    .mc-wrap {
      display: grid;
      grid-template-columns: 224px minmax(0, 1fr);
    }
    .mc-side {
      display: flex;
      flex-direction: column;
      gap: 18px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      padding: 22px 14px;
      background: var(--aml-panel);
      border-right: 1px solid var(--aml-line);
    }
    .mc-main { display: block; min-width: 0; }
    .mc-side .aml-hero {
      padding: 6px 4px 0;
      background: none;
    }
    .mc-side .aml-hero-in {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      margin: 0;
      max-width: 100%;
    }
    .mc-side .aml-hero .aml-profile { width: 84px; height: 84px; }
    .mc-side .aml-hero-name {
      font-size: 34px;
      line-height: 1.15;
      overflow-wrap: anywhere;
    }
    .mc-side .aml-hero-meta { align-self: stretch; }
    .mc-side .aml-hero-desc { margin: 0; max-width: 100%; }
    .mc-side .aml-hero-more { background: linear-gradient(90deg, transparent, var(--aml-panel) 1.6em); }
    .mc-side .aml-hero .aml-socials {
      width: 100%;
      margin: 4px 0 0;
    }
    .mc-side .aml-hero-actions {
      flex-wrap: wrap;
      margin-top: 4px;
    }
    .mc-nav {
      position: static;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
      padding: 0;
      border: 0;
      background: transparent;
    }
    .mc-nav .aml-menu { flex-direction: column; gap: 4px; overflow: visible; }
    .mc-nav .aml-menu-item {
      height: 36px;
      padding: 0 12px;
      background: transparent;
    }
    .mc-nav .aml-menu-item:hover { background: var(--aml-panel-2); }
    .mc-nav .aml-menu-item.is-active {
      background: var(--aml-panel-2);
      color: var(--aml-accent);
      box-shadow: inset 2px 0 0 var(--aml-accent);
    }
    .mc-main .aml-content { padding: 22px 32px 40px; }
  }

  @media (max-width: 733px) {
    .mc-side .aml-hero { padding: 12px 16px; }
    .aml-kit .aml-hero-name { font-size: 20px; }
    .aml-kit .aml-section-title { font-size: 18px; }
    .aml-kit .aml-track { height: 68px; }
    .aml-kit .aml-albums {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px 12px;
    }
  }
</style>
</head>
<body class="aml-kit">
<div class="mc-wrap">
  <aside class="mc-side">
    {{hero}}
    <div class="mc-nav">{{menu}}{{lang_select}}</div>
    {{ad_left}}
  </aside>
  <div class="mc-main">
    {{banner}}
    {{ad_top}}
    {{content}}
    {{footer}}
  </div>
</div>
{{player}}
</body>
</html>
