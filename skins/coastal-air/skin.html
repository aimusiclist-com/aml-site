<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F4FAFB">
<title>{{site_name}}</title>
<style>
  /* Coastal Air: sea-glass colors, open space, no decorative assets. */
  :root {
    --aml-bg: #F4FAFB;
    --aml-panel: #FFFFFF;
    --aml-panel-2: #E6F1F4;
    --aml-text: #182E35;
    --aml-muted: #536A70;
    --aml-line: rgb(20 103 122 / .17);
    --aml-glass: rgb(244 250 251 / .97);
    --aml-accent: #14677A;
    --aml-accent-fill: #14677A;
    --aml-accent-ink: #FFFFFF;
    --aml-font: -apple-system, BlinkMacSystemFont, "SF Pro Text",
      "Pretendard Variable", Pretendard, "Apple SD Gothic Neo",
      "Hiragino Sans", system-ui, "Segoe UI", Roboto,
      "Noto Sans Thai", "Leelawadee UI", "Noto Sans Devanagari",
      "Nirmala UI", sans-serif;
    --aml-hero-a: 0%;
    --aml-art-shadow: none;
    --aml-viz-color: #14677A;
    --aml-viz-opacity: .18;
    --aml-viz-gap: 3px;
    --aml-max: 1100px;
    --aml-player-left: 0;
    --aml-modal-bg: #FFFFFF;
    --aml-modal-text: #182E35;
    --aml-card-bg: #FFFFFF;
    --aml-footer-color: #536A70;
    --aml-social-color: #14677A;
    --aml-ext-color: #536A70;
  }

  .aml-kit { font-size: 15px; line-height: 1.55; }

  /* One static wash fades fully into the page before the description. */
  .aml-kit .aml-hero {
    padding: 20px 32px 18px;
    background: linear-gradient(to bottom, #E8F5F8 0, var(--aml-bg) 72px);
    border-bottom: 1px solid var(--aml-line);
  }
  .aml-kit .aml-hero-in {
    grid-template-columns: 88px minmax(0, 1fr);
    column-gap: 20px;
  }
  .aml-kit .aml-hero .aml-profile { width: 88px; height: 88px; }
  .aml-kit .aml-hero-name {
    font-size: 32px;
    font-weight: 650;
    letter-spacing: 0;
  }
  .aml-kit .aml-hero-desc { line-height: 1.55; }
  .aml-kit .aml-hero-more {
    background: linear-gradient(90deg, transparent, var(--aml-bg) 1.6em);
  }

  /* Horizontal tabs stay readable without a backdrop blur pass. */
  .aml-kit .aml-bar {
    background: var(--aml-glass);
    border-bottom: 1px solid var(--aml-line);
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
  }
  .aml-kit .aml-menu { gap: 10px; }
  .aml-kit .aml-menu-item {
    border: 1px solid transparent;
    background: var(--aml-panel);
    color: var(--aml-text);
  }
  .aml-kit .aml-menu-item:hover { background: var(--aml-panel-2); }
  .aml-kit .aml-menu-item.is-active {
    background: var(--aml-panel-2);
    border-color: var(--aml-line);
    color: var(--aml-accent);
  }
  .aml-kit .aml-lang-select { border: 1px solid var(--aml-line); }

  .aml-kit .aml-section-title {
    font-size: 19px;
    font-weight: 650;
    letter-spacing: 0;
  }
  .aml-kit .aml-list { gap: 6px; }
  .aml-kit .aml-track {
    height: 66px;
    background: var(--aml-panel);
    border: 1px solid var(--aml-line);
    border-radius: 16px;
    box-shadow: none;
  }
  .aml-kit .aml-track-title {
    font-size: 16px;
    font-weight: 600;
    line-height: 1.22;
    white-space: normal;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    overflow-wrap: anywhere;
  }
  .aml-kit .aml-track-artist { font-size: 13px; }
  .aml-kit .aml-genres,
  .aml-kit .aml-track-time { font-size: 12px; font-weight: 550; }

  .aml-kit .aml-albums {
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 24px 18px;
  }
  .aml-kit .aml-album-cover,
  .aml-kit .aml-album-head .aml-album-cover {
    border: 1px solid var(--aml-line);
    border-radius: 10px;
    box-shadow: none;
  }
  .aml-kit .aml-gb-form,
  .aml-kit .aml-gb-post,
  .aml-kit .aml-view-links .aml-social {
    border: 1px solid var(--aml-line);
    border-radius: 16px;
    box-shadow: none;
  }
  .aml-kit .aml-social.is-highlight {
    box-shadow: none;
    outline: 1px solid var(--aml-accent);
  }

  @media (max-width: 733px) {
    .aml-kit .aml-hero { padding: 12px 16px 10px; }
    .aml-kit .aml-hero-in {
      grid-template-columns: 72px minmax(0, 1fr);
      column-gap: 12px;
    }
    .aml-kit .aml-hero .aml-profile { width: 72px; height: 72px; }
    .aml-kit .aml-hero-name { font-size: 20px; }
    .aml-kit .aml-hero-desc { margin-top: 4px; line-height: 1.45; }
    .aml-kit .aml-hero-actions { margin-top: 6px; }
    .aml-kit .aml-section-title { font-size: 18px; margin: 8px 0; }
    .aml-kit .aml-list { gap: 5px; }
    .aml-kit .aml-track { height: 66px; }
    .aml-kit .aml-albums {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px 12px;
    }
  }
</style>
</head>
<body class="aml-kit">
{{banner}}
{{hero}}
<div class="aml-bar">{{menu}}{{lang_select}}</div>
{{ad_top}}
{{content}}
{{footer}}
{{player}}
</body>
</html>
