<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FCF3E2">
<title>{{site_name}}</title>
<style>
  /* Honey Tape: warm album paper, precise cassette label lines. */
  :root {
    --aml-bg: #FCF3E2;
    --aml-panel: #FFFDF6;
    --aml-panel-2: #F0E6D3;
    --aml-text: #302419;
    --aml-muted: #745F49;
    --aml-line: rgb(132 81 31 / .16);
    --aml-glass: rgb(255 253 246 / .96);
    --aml-accent: #84511F;
    --aml-accent-fill: #84511F;
    --aml-accent-ink: #FFFFFF;
    --aml-font: -apple-system, BlinkMacSystemFont, "SF Pro Text",
      "Pretendard Variable", Pretendard, "Apple SD Gothic Neo",
      "Hiragino Sans", system-ui, "Segoe UI", Roboto,
      "Noto Sans Thai", "Leelawadee UI", "Noto Sans Devanagari",
      "Nirmala UI", sans-serif;
    --aml-hero-a: 0%;
    --aml-art-shadow: none;
    --aml-viz-color: #84511F;
    --aml-viz-opacity: .18;
    --aml-viz-gap: 3px;
    --aml-max: 1100px;
    --aml-player-left: 0;
    --aml-modal-bg: #FFFDF6;
    --aml-modal-text: #302419;
    --aml-card-bg: #FFFDF6;
    --aml-footer-color: #745F49;
    --aml-social-color: #84511F;
    --aml-ext-color: #745F49;
    color-scheme: light;
  }

  .aml-kit { font-size: 15px; line-height: 1.5; font-variant-numeric: tabular-nums; }
  html:lang(ko) .aml-kit,
  html:lang(ja) .aml-kit,
  html:lang(zh) .aml-kit { line-height: 1.6; }

  /* Double 1px rule and a quiet two-tone cassette-label stripe. */
  .aml-kit .aml-hero {
    position: relative;
    padding: 24px 32px 20px;
    border-top: 3px double var(--aml-accent);
    border-bottom: 1px solid var(--aml-line);
    background: var(--aml-panel);
  }
  .aml-kit .aml-hero::before {
    content: "";
    position: absolute;
    top: 8px;
    right: 32px;
    width: 112px;
    height: 4px;
    background: linear-gradient(90deg,
      var(--aml-accent) 0 50%, var(--aml-panel-2) 50% 100%);
  }
  .aml-kit .aml-hero-in {
    grid-template-columns: 80px minmax(0, 1fr);
    column-gap: 18px;
  }
  .aml-kit .aml-hero .aml-profile { width: 80px; height: 80px; }
  .aml-kit .aml-hero-name {
    font-size: 31px;
    font-weight: 750;
    letter-spacing: normal;
  }
  .aml-kit .aml-hero-meta {
    font-size: 12px;
    font-weight: 500;
  }
  .aml-kit .aml-hero-desc {
    font-size: 13px;
    line-height: 1.5;
  }
  .aml-kit .aml-hero-more {
    background: linear-gradient(90deg, transparent, var(--aml-panel) 1.6em);
  }
  .aml-kit .aml-hero .aml-socials { gap: 12px; margin-top: 6px; }
  .aml-kit .aml-hero-actions { margin-top: 8px; }

  /* Fixed-color label-strip navigation: no backdrop blur or extra assets. */
  .ht-nav {
    position: sticky;
    top: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px max(16px, calc((100% - var(--aml-max, 1100px)) / 2 + 32px));
    border-bottom: 1px solid var(--aml-line);
    background: var(--aml-bg);
  }
  .aml-kit .aml-menu { gap: 6px; }
  .aml-kit .aml-menu-item {
    background: transparent;
    border-radius: 6px;
    color: var(--aml-muted);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .04em;
    border-bottom: 2px solid transparent;
  }
  .aml-kit .aml-menu-item:hover {
    background: var(--aml-panel-2);
    color: var(--aml-text);
  }
  .aml-kit .aml-menu-item.is-active {
    background: var(--aml-panel);
    color: var(--aml-text);
    border-bottom-color: var(--aml-accent);
  }
  .aml-kit .aml-lang-select { border-radius: 6px; }

  .aml-kit .aml-section-title {
    font-size: 18px;
    font-weight: 650;
    letter-spacing: normal;
  }
  .aml-kit .aml-list { gap: 6px; }
  .aml-kit .aml-track {
    height: 64px;
    border: 1px solid var(--aml-line);
    border-radius: 6px;
    box-shadow: none;
  }
  .aml-kit .aml-track-title {
    font-size: 15px;
    font-weight: 650;
    line-height: 1.2;
    letter-spacing: normal;
    white-space: normal;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    overflow: hidden;
    overflow-wrap: anywhere;
  }
  .aml-kit .aml-track-artist,
  .aml-kit .aml-genres,
  .aml-kit .aml-track-time {
    font-size: 12px;
    font-weight: 500;
  }
  .aml-kit .aml-albums {
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 24px 16px;
  }
  .aml-kit .aml-album-cover,
  .aml-kit .aml-album-head .aml-album-cover {
    border-radius: 6px;
    box-shadow: none;
  }
  .aml-kit .aml-gb-form,
  .aml-kit .aml-gb-post,
  .aml-kit .aml-view-links .aml-social {
    border: 1px solid var(--aml-line);
    border-radius: 6px;
    box-shadow: none;
  }
  .aml-kit .aml-social.is-highlight {
    box-shadow: none;
    outline: 1px solid var(--aml-accent);
  }

  @media (max-width: 733px) {
    .aml-kit .aml-hero { padding: 12px 16px 10px; }
    .aml-kit .aml-hero::before { right: 16px; width: 72px; }
    .aml-kit .aml-hero-in {
      grid-template-columns: 64px minmax(0, 1fr);
      column-gap: 12px;
    }
    .aml-kit .aml-hero .aml-profile { width: 64px; height: 64px; }
    .aml-kit .aml-hero-name { font-size: 21px; }
    .aml-kit .aml-hero-desc { margin-top: 4px; }
    .aml-kit .aml-hero .aml-socials { margin-top: 3px; }
    .aml-kit .aml-hero-actions { margin-top: 6px; }
    .ht-nav { padding: 5px 16px; }
    .aml-kit .aml-section-title { font-size: 18px; margin: 8px 0; }
    .aml-kit .aml-list { gap: 5px; }
    .aml-kit .aml-track { height: 64px; }
    .aml-kit .aml-albums {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px 12px;
    }
  }
</style>
</head>
<body class="aml-kit">
{{banner}}
{{hero}}
<div class="ht-nav">{{menu}}{{lang_select}}</div>
{{ad_top}}
{{content}}
{{footer}}
{{player}}
</body>
</html>
