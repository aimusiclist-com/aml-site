<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FAF8F2">
<title>{{site_name}}</title>
<style>
  /* Ivory Atelier: warm paper, editorial type and quiet gallery spacing. */
  :root {
    --aml-bg: #FAF8F2;
    --aml-panel: #FFFFFF;
    --aml-panel-2: #F0EDE5;
    --aml-text: #24221F;
    --aml-muted: #615D56;
    --aml-line: rgb(36 34 31 / .13);
    --aml-glass: rgb(250 248 242 / .94);
    --aml-accent: #815A3E;
    --aml-accent-fill: #815A3E;
    --aml-accent-ink: #FFFFFF;
    --aml-font: -apple-system, BlinkMacSystemFont, "SF Pro Text",
      "Pretendard Variable", Pretendard, "Apple SD Gothic Neo",
      "Hiragino Sans", system-ui, "Segoe UI", Roboto,
      "Noto Sans Thai", "Leelawadee UI", "Noto Sans Devanagari",
      "Nirmala UI", sans-serif;
    --aml-hero-a: 6%;
    --aml-art-shadow: none;
    --aml-viz-color: #815A3E;
    --aml-viz-opacity: .18;
    --aml-viz-gap: 3px;
    --aml-max: 1100px;
    --aml-player-left: 0;
    --aml-modal-bg: #FFFFFF;
    --aml-modal-text: #24221F;
    --aml-card-bg: #FFFFFF;
    --aml-footer-color: #615D56;
    --aml-social-color: #815A3E;
    --aml-ext-color: #615D56;
  }

  .aml-kit { font-size: 15px; line-height: 1.6; }
  .aml-kit .aml-hero {
    padding: 24px 32px 22px;
    border-bottom: 1px solid var(--aml-line);
  }
  .aml-kit .aml-hero-in {
    grid-template-columns: 88px minmax(0, 1fr);
    column-gap: 20px;
  }
  .aml-kit .aml-hero .aml-profile { width: 88px; height: 88px; }
  .aml-kit .aml-hero-name {
    font-family: Georgia, "Times New Roman", ui-serif, serif;
    font-size: 36px;
    font-weight: 700;
    letter-spacing: -.02em;
  }
  .aml-kit .aml-hero-desc { line-height: 1.55; }

  /* Slim horizontal editorial navigation, with no extra blur pass. */
  .aml-kit .aml-bar {
    border-bottom: 1px solid var(--aml-line);
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
  }
  .aml-kit .aml-menu-item { border-radius: 6px; background: transparent; }
  .aml-kit .aml-menu-item:hover { background: var(--aml-panel-2); }
  .aml-kit .aml-menu-item.is-active {
    color: var(--aml-text);
    background: var(--aml-panel);
    box-shadow: inset 0 -2px 0 var(--aml-accent);
  }
  .aml-kit .aml-lang-select { border-radius: 6px; }

  .aml-kit .aml-section-title {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -.01em;
  }
  .aml-kit .aml-list { gap: 7px; }
  .aml-kit .aml-track {
    height: 72px;
    border: 1px solid var(--aml-line);
    border-radius: 8px;
    box-shadow: none;
  }
  .aml-kit .aml-albums {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 28px 22px;
  }
  .aml-kit .aml-album-cover { border-radius: 6px; box-shadow: none; }
  .aml-kit .aml-album-title { font-size: 15px; }
  .aml-kit .aml-album-head .aml-album-cover { border-radius: 6px; }
  .aml-kit .aml-gb-form,
  .aml-kit .aml-gb-post,
  .aml-kit .aml-view-links .aml-social {
    border: 1px solid var(--aml-line);
    border-radius: 8px;
    box-shadow: none;
  }

  /* One lead album in the full desktop gallery; the mobile grid stays equal. */
  @media (min-width: 734px) {
    body.aml-kit[data-aml-view="albums"] .aml-albums > .aml-album:first-child {
      grid-column: span 2;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, .85fr);
      grid-template-rows: auto 1fr;
      align-items: center;
      gap: 4px 20px;
      padding: 16px;
      border: 1px solid var(--aml-line);
      border-radius: 8px;
      background: var(--aml-panel);
    }
    body.aml-kit[data-aml-view="albums"] .aml-albums > .aml-album:first-child .aml-album-cover {
      grid-row: 1 / 3;
      align-self: start;
    }
    body.aml-kit[data-aml-view="albums"] .aml-albums > .aml-album:first-child .aml-album-title {
      align-self: end;
      margin-top: 0;
      font-size: 18px;
      white-space: normal;
      overflow-wrap: anywhere;
    }
    body.aml-kit[data-aml-view="albums"] .aml-albums > .aml-album:first-child .aml-album-artist {
      align-self: start;
    }
  }

  @media (max-width: 733px) {
    .aml-kit .aml-hero { padding: 12px 16px; }
    .aml-kit .aml-hero-in {
      grid-template-columns: 72px minmax(0, 1fr);
      column-gap: 12px;
    }
    .aml-kit .aml-hero .aml-profile { width: 72px; height: 72px; }
    .aml-kit .aml-hero-name { font-size: 20px; }
    .aml-kit .aml-section-title { font-size: 18px; }
    .aml-kit .aml-track { height: 68px; }
    .aml-kit .aml-albums {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px 12px;
    }
  }
</style>
</head>
<body class="aml-kit">
{{banner}}
{{hero}}
<div class="aml-bar">{{menu}}{{lang_select}}</div>
{{ad_top}}
{{content}}
{{footer}}
{{player}}
</body>
</html>
