<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0E1626">
<title>{{site_name}}</title>
<style>
:root {
  --aml-bg:#0E1626; --aml-panel:#16213A; --aml-panel-2:#26334E;
  --aml-text:#EEF0F5; --aml-muted:#A9B1C6; --aml-line:#24304D;
  --aml-glass:rgb(14 22 38 / .98);
  --aml-accent:#D4A85A; --aml-accent-fill:#D4A85A; --aml-accent-ink:#0E1626;
  --aml-font:-apple-system, BlinkMacSystemFont, "Pretendard Variable", Pretendard,
    "Apple SD Gothic Neo", "Hiragino Sans", system-ui, "Segoe UI", Roboto,
    "Noto Sans Thai", "Leelawadee UI", "Noto Sans Devanagari", "Nirmala UI", sans-serif;
  --aml-hero-a:0%; --aml-art-shadow:none;
  --aml-viz-color:#D4A85A; --aml-viz-opacity:.18; --aml-viz-gap:3px;
  --aml-max:1100px; --aml-player-left:0; --aml-modal-bg:#16213A;
  --aml-modal-text:#EEF0F5; --aml-card-bg:#16213A;
  --aml-footer-color:#A9B1C6; --aml-social-color:#D4A85A;
  --aml-ext-color:#A9B1C6; --aml-rank-up:#D4A85A; --aml-rank-down:#A9B1C6;
  color-scheme:dark;
}
/* A quiet late-night listening lounge, in navy and brass. */
.aml-kit { font-size:15px; line-height:1.55; letter-spacing:normal; }
.aml-kit .aml-hero {
  padding:22px 30px 19px;
  background:var(--aml-bg);
  border-bottom:1px solid var(--aml-line);
}
.aml-kit .aml-hero-in {
  grid-template-columns:96px minmax(0,1fr); column-gap:24px;
}
.aml-kit .aml-hero .aml-profile {
  width:96px; height:96px; border-radius:50%;
  border:1px solid var(--aml-accent);
  object-fit:cover;
}
.aml-kit .aml-hero-name {
  font-family:Georgia, "Times New Roman", serif;
  font-size:40px; line-height:1.1; font-weight:700; letter-spacing:-.015em;
  overflow-wrap:anywhere;
}
.aml-kit .aml-hero-name::after {
  content:""; display:block; width:40px; height:1px; margin-top:10px;
  background:var(--aml-accent);
}
.aml-kit .aml-hero-desc { line-height:1.55; }
.aml-kit .aml-hero-more {
  background:linear-gradient(90deg, transparent, var(--aml-bg) 1.6em);
}
.aml-kit .aml-bar {
  background:var(--aml-bg); border-bottom:1px solid var(--aml-line);
  -webkit-backdrop-filter:none; backdrop-filter:none;
}
.aml-kit .aml-menu { gap:14px; }
.aml-kit .aml-menu-item {
  padding:12px 10px 10px; border:0; border-bottom:2px solid transparent;
  border-radius:0; background:transparent; color:var(--aml-muted);
  font-size:14px; font-weight:600;
}
.aml-kit .aml-menu-item:hover { color:var(--aml-text); background:transparent; }
.aml-kit .aml-menu-item.is-active {
  color:var(--aml-accent); background:transparent;
  border-bottom-color:var(--aml-accent);
}
.aml-kit .aml-lang-select { border-radius:8px; }
.aml-kit .aml-section-title {
  font-family:Georgia, "Times New Roman", serif;
  font-size:23px; font-weight:700; letter-spacing:-.005em;
}
.aml-kit .aml-list { gap:7px; }
.aml-kit .aml-track {
  height:64px; min-height:64px; border:1px solid transparent;
  border-radius:12px; background:var(--aml-panel); box-shadow:none;
}
.aml-kit .aml-track.is-playing {
  background:var(--aml-panel); border-color:var(--aml-accent);
}
.aml-kit .aml-track.is-playing .aml-track-title { color:var(--aml-accent); }
.aml-kit .aml-track-title {
  font-size:16px; font-weight:600; line-height:1.3; overflow-wrap:anywhere;
}
.aml-kit .aml-track-artist, .aml-kit .aml-genres,
.aml-kit .aml-track-time { color:var(--aml-muted); font-size:13px; }
.aml-kit .aml-albums {
  grid-template-columns:repeat(4,minmax(0,1fr)); gap:24px 18px;
}
.aml-kit .aml-album-cover, .aml-kit .aml-album-head .aml-album-cover {
  border-radius:8px; box-shadow:none;
}
.aml-kit .aml-album-title { font-weight:650; }
.aml-kit .aml-gb-form, .aml-kit .aml-gb-post,
.aml-kit .aml-view-links .aml-social {
  border-radius:12px; border:1px solid var(--aml-line); box-shadow:none;
}
/* Keep infinite scrolling and its fallback action available. */
.aml-kit .aml-load-more {
  border:1px solid var(--aml-line);
  border-radius:8px;
  background:var(--aml-panel);
  color:var(--aml-text);
}
@media (max-width:733px) {
  .aml-kit .aml-hero { padding:12px 16px 10px; }
  .aml-kit .aml-hero-in {
    grid-template-columns:64px minmax(0,1fr); column-gap:12px;
  }
  .aml-kit .aml-hero .aml-profile { width:64px; height:64px; }
  .aml-kit .aml-hero-name { font-size:27px; }
  .aml-kit .aml-hero-name::after { margin-top:5px; }
  .aml-kit .aml-hero-desc { margin-top:3px; line-height:1.45; }
  .aml-kit .aml-hero-actions { margin-top:5px; }
  .aml-kit .aml-menu { gap:7px; }
  .aml-kit .aml-menu-item { padding:10px 6px 8px; }
  .aml-kit .aml-section-title { font-size:19px; }
  .aml-kit .aml-list { gap:5px; }
  .aml-kit .aml-albums {
    grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px 12px;
  }
}
</style>
</head>
<body class="aml-kit">
{{banner}}
{{hero}}
<div class="aml-bar">{{menu}}{{lang_select}}</div>
{{ad_top}}
{{content}}
{{footer}}
{{player}}
</body>
</html>
