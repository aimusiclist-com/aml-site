<!doctype html>
<!-- 기본 스킨: light (3-9, 스킨규격 v1.5). 모양은 사이트 기본 디자인(body class="aml-kit")이 그리고, 이 파일은 색과 배치만 정한다.
     색을 바꾸려면 아래 :root 의 값만 고치면 된다. 재생 바·곡 줄·앨범·방명록이 모두 이 색을 따른다. -->
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<title>{{site_name}}</title>
<style>
  :root {
    /* 바탕·글자 (디자인규격 v1 밝은 모드) */
    --aml-bg: #ffffff;          /* 페이지 바탕 */
    --aml-panel: #f5f5f7;       /* 곡 줄·카드·메뉴 알약 */
    --aml-panel-2: #e8e8ed;     /* 눌린 칸·빈 이미지 */
    --aml-text: #1d1d1f;        /* 글자 */
    --aml-muted: #6e6e73;       /* 보조 글자 (아티스트·장르·시간) */
    --aml-line: rgb(0 0 0 / .08);
    --aml-glass: rgb(250 250 252 / .74);   /* 메뉴 막대·재생 바 (뒤가 흐리게 비침) */
    /* 강조색: 링크·진행선·재생 중 표시는 --aml-accent, 버튼 바탕은 --aml-accent-fill */
    --aml-accent: #6b4eff;
    --aml-accent-fill: #6b4eff;
    --aml-accent-ink: #ffffff;
    /* 글꼴: 애플 기기는 SF Pro, 그 밖에는 사이트에 들어 있는 Pretendard */
    --aml-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Hiragino Sans",
                system-ui, "Segoe UI", Roboto, "Noto Sans Thai", "Leelawadee UI", "Noto Sans Devanagari", "Nirmala UI", sans-serif;
    --aml-hero-a: 8%;           /* 머리 영역 바탕에 프로필 평균 색을 얼마나 섞을지 */
    --aml-art-shadow: 0 2px 8px rgb(0 0 0 / .12);
    /* 비주얼라이저 (재생 중인 곡 줄 뒤 막대 7개) */
    --aml-viz-color: #6b4eff;
    --aml-viz-opacity: .2;
    --aml-viz-gap: 3px;
    /* 예전 부품 색 (가사 창·하단 문구·SNS·확장 칩) */
    --aml-modal-bg: #ffffff; --aml-modal-text: #1d1d1f; --aml-card-bg: #f5f5f7;
    --aml-footer-color: #6e6e73; --aml-social-color: #1d1d1f; --aml-ext-color: #6e6e73;
  }
</style>
</head>
<body class="aml-kit">
{{banner}}
{{hero}}
<div class="aml-bar">{{menu}}{{lang_select}}</div>
{{ad_top}}
{{content}}
{{footer}}
{{player}}
</body>
</html>
