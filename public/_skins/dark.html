<!doctype html>
<!-- 기본 스킨: dark (3-9, 스킨규격 v1.5). 모양은 사이트 기본 디자인(body class="aml-kit"), 이 파일은 색과 배치만 정한다.
     넓은 화면(1068px 이상)에서는 왼쪽 사이드바(반투명 유리) + 오른쪽 본문, 휴대폰에서는 light 와 같은 배치. -->
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>{{site_name}}</title>
<style>
  :root {
    /* 바탕·글자 (디자인규격 v1 어두운 모드) */
    --aml-bg: #000000;
    --aml-panel: #1c1c1e;
    --aml-panel-2: #2c2c2e;
    --aml-text: #f5f5f7;
    --aml-muted: #98989d;
    --aml-line: rgb(255 255 255 / .1);
    --aml-glass: rgb(28 28 30 / .74);
    --aml-accent: #8f7dff;
    --aml-accent-fill: #7457ff;
    --aml-accent-ink: #ffffff;
    --aml-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Hiragino Sans",
                system-ui, "Segoe UI", Roboto, "Noto Sans Thai", "Leelawadee UI", "Noto Sans Devanagari", "Nirmala UI", sans-serif;
    --aml-hero-a: 20%;
    --aml-art-shadow: none;
    --aml-viz-color: #8f7dff;
    --aml-viz-opacity: .25;
    --aml-viz-gap: 3px;
    --aml-error: #ff453a;
    --aml-modal-bg: #1c1c1e; --aml-modal-text: #f5f5f7; --aml-card-bg: #1c1c1e;
    --aml-footer-color: #98989d; --aml-social-color: #f5f5f7; --aml-ext-color: #98989d;
    color-scheme: dark;
  }
  .dk-brand { display: none; }

  /* 휴대폰·태블릿: 배너 → 머리 영역 → 메뉴(위에 붙음) → 본문 순서로 한 줄 */
  .dk-wrap { display: flex; flex-direction: column; min-height: 100vh; }
  .dk-side, .dk-main { display: contents; }
  .aml-banner { order: 1; } .aml-hero { order: 2; } .dk-nav { order: 3; } .aml-ad-top { order: 4; }
  .aml-content { order: 5; width: 100%; } .aml-footer { order: 6; } .aml-ad-left { order: 7; }

  /* 넓은 화면: 왼쪽 사이드바 260px */
  @media (min-width: 1068px) {
    body { --aml-player-left: 260px; }
    .dk-wrap { display: grid; grid-template-columns: 260px minmax(0, 1fr); }
    .dk-side { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
      padding: 24px 12px; background: var(--aml-glass); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
      box-shadow: inset -.5px 0 0 var(--aml-line); }
    .dk-main { display: block; min-width: 0; }
    .dk-brand { display: block; padding: 0 12px; font-size: 20px; font-weight: 700; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dk-nav { position: static; flex-direction: column; align-items: stretch; gap: 12px; padding: 0; background: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
    .dk-nav .aml-menu { flex-direction: column; gap: 2px; margin: 0; overflow: visible; }
    .dk-nav .aml-menu-item { height: 36px; padding: 0 12px; border-radius: 8px; background: transparent; color: var(--aml-text); }
    .dk-nav .aml-menu-item:hover { background: var(--aml-panel-2); }
    .dk-nav .aml-menu-item.is-active { background: var(--aml-panel-2); color: var(--aml-accent); font-weight: 600; }
    .dk-nav .aml-lang { padding: 0 12px; }
    .aml-ad-left { margin: 0 8px; }
  }
</style>
</head>
<body class="aml-kit">
<div class="dk-wrap">
  <aside class="dk-side">
    <div class="dk-brand">{{site_name}}</div>
    <div class="aml-bar dk-nav">{{menu}}{{lang_select}}</div>
    {{ad_left}}
  </aside>
  <div class="dk-main">
    {{banner}}
    {{hero}}
    {{ad_top}}
    {{content}}
    {{footer}}
  </div>
</div>
{{player}}
</body>
</html>
